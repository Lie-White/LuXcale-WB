[project]
name = "imquant"
version = "1.0.4"
description = "Image quantification to publication-ready graphs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "tifffile",
    "matplotlib",
    "liffile>=2026.10.14",
    "pyside6>=6.12.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest's cache inside the project too (default is .pytest_cache in the root, ignored by git).
cache_dir = ".pytest_cache"
# tmp_path folders inside the project; pytest's default is the system Temp folder.
addopts = "--basetemp=output/pytest-tmp"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
